# @package _global_

defaults:
  - motion_tracking_booster_k1_lafan_walk_medium_original_rewards
  - _self_

project_name: HoloMotionBoosterK1LaFANDanceMediumOriginalRewards

# Train only the seven dance clips available in the subject1-4 training split.
# Subject 5 remains validation-only and never contributes gradients.
robot:
  motion:
    handpicked_motion_names:
      - dance1_subject1
      - dance1_subject2
      - dance1_subject3
      - dance2_subject1
      - dance2_subject2
      - dance2_subject3
      - dance2_subject4
      - dance2_subject5

# Set this environment variable to the completed medium walk checkpoint before
# starting stage 2.  The variable has no unsafe default because 256-wide
# checkpoints are architecture-incompatible with this 512-wide actor.
checkpoint: ${oc.env:K1_MEDIUM_DANCE_INIT_CHECKPOINT,null}

algo:
  config:
    checkpoint_load_mode: finetune
    finetune_continue_iteration: false
    num_learning_iterations: 20000
    actor_learning_rate: 1.0e-5
    critic_learning_rate: 3.0e-5
