# @package _global_

defaults:
  - motion_tracking_booster_k1_lafan_walk_dance_joint_reward_small
  - _self_

project_name: HoloMotionK1ReleaseV1Pilot

# Candidate integration test. This is NOT the final long-training release.
# New sources enter only after producing their numerical/visual QA artifacts.
checkpoint: logs/HoloMotionBoosterK1LaFANWalkDanceJointRewardSmall/20261016_092811-motion_tracking_booster_k1_lafan_walk_dance_joint_reward_small/model_13000.pt

train_hdf5_roots:
