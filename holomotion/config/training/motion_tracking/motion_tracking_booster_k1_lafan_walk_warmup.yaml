# @package _global_

defaults:
  - motion_tracking_booster_k1_lafan
  - override /env/domain_randomization: NO_domain_rand
  - override /env/terrain: isaaclab_plane
  - _self_

project_name: HoloMotionBoosterK1LaFANWalkWarmup

# Stage 1: learn a clean locomotion prior before adding difficult motions,
# rough terrain, pushes, delays, and physical randomization.
robot:
  motion:
    handpicked_motion_names:
      - walk1_subject1
      - walk1_subject2
      - walk2_subject1
      - walk2_subject3
      - walk2_subject4
      - walk3_subject1
      - walk3_subject2
      - walk3_subject3
      - walk3_subject4
      - walk4_subject1
      - walk1_subject5
      - walk3_subject5

# Hydra merges config groups recursively, so explicitly neutralize the event
# entries inherited from the medium-randomization baseline.
domain_rand:
  default_dof_pos_bias:
    params:
      pos_distribution_params: [0.0, 0.0]

  rigid_body_com:
    params:
      com_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]

  randomize_mass:
    params:
      mass_range: [0.0, 0.0]

  rigid_body_material:
    params:
      static_friction_range: [1.0, 1.0]
      dynamic_friction_range: [1.0, 1.0]
      restitution_range: [0.0, 0.0]

  push_by_setting_velocity:
    params:
      velocity_range:
        x: [0.0, 0.0]
        y: [0.0, 0.0]
        z: [0.0, 0.0]
        roll: [0.0, 0.0]
        pitch: [0.0, 0.0]
        yaw: [0.0, 0.0]

  randomize_actuator_gains:
    params:
      stiffness_distribution_params: [1.0, 1.0]
      damping_distribution_params: [1.0, 1.0]

rewards:
  # The baseline only tracks velocity and relative pose. A small world-XY
  # reward prevents the policy from satisfying those terms with slow shuffling.
  root_pos_xy_tracking_exp:
    weight: 1.0
    params:
      std: 0.5

  root_rot_tracking_exp:
    weight: 0.5

  root_lin_vel_tracking_rel_ratio_exp:
    weight: 4.0

  # Penalize a planted K1 foot moving across the ground.
  feet_slide:
    weight: -0.25
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        body_names:
          - ".*_ankle_roll_link"
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names:
          - ".*_ankle_roll_link"

modules:
  actor:
    # Eight experts are sufficient for the walk-only warm-up and reduce the
    # amount of data each expert needs before it becomes useful.
    num_fine_experts: 8

algo:
  config:
    num_learning_iterations: 5000
    init_noise_std: 0.6

    # The first run selected one expert for nearly every token. Keep sparse
    # routing, but explicitly discourage that collapse.
    inactive_expert_margin_to_topk:
      weight: 1.0
    moe_load_balance:
      enabled: true
      weight: 0.01
