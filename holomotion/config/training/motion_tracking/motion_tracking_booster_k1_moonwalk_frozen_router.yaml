# @package _global_

defaults:
  - motion_tracking_booster_k1_moonwalk_v14_finetune
  - _self_

project_name: HoloMotionK1MoonwalkFrozenRouter
num_envs: 64
# Bootstrap both controller branches from the intact general model, never 3998.
checkpoint: logs/HoloMotionK1SequentialCurriculum/overnight_20261020_153041_Bl3s1P/stage_3_complex/model_11999.pt

modules:
  actor:
    type: FrozenBaseSlidingPolicy
    sliding_router:
      # Stage A: train the specialist with an explicit route; gate stays frozen.
      # base/hard are evaluation modes; soft uses the same blend in rollout/PPO.
      mode: specialist
      bootstrap_from_general: true
      train_specialist: true
      train_gate: false
      hidden_dim: 64
      initial_bias: -4.0
      threshold: 0.5
    obs_norm:
      update_at_train: false
      update_at_eval: false

algo:
  config:
    checkpoint_load_mode: finetune
    finetune_continue_iteration: false
    override_sigma: false
    fix_sigma: true
    num_learning_iterations: 500
    save_interval: 100
    actor_learning_rate: 3.0e-6
    critic_learning_rate: 1.0e-5
    # Existing auxiliary heads are retained for strict checkpoint compatibility.
    # This prototype is PyTorch-only, with independent native branch KV caches.
    export_policy: false
    dynamo_backend: null

robot:
  motion:
    dataloader:
      num_workers: 0
      timeout: 0

mujoco_eval:
  enabled: false
