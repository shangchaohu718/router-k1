# @package _global_

defaults:
  - motion_tracking_booster_k1_lafan_walk_warmup
  - _self_

project_name: HoloMotionBoosterK1LaFANDanceWarmup

# Stage 2: specialize the stable K1 walk policy on the seven LaFAN dance
# motions that are present in the subject1-4 training split.  Subject 5 is
# listed only so that the validation loader can evaluate an unseen dancer; it
# is absent from the training HDF5 and therefore never contributes gradients.
robot:
  motion:
    handpicked_motion_names:
      - dance1_subject1
      - dance1_subject2
      - dance1_subject3
      - dance2_subject1
      - dance2_subject2
      - dance2_subject3
      - dance2_subject4
      - dance2_subject5

# Warm-start the actor and critic, but reset Adam and iteration-dependent
# schedules for the new dance task.  The environment variable keeps the
# checkpoint easy to replace without editing this config.
checkpoint: ${oc.env:K1_DANCE_INIT_CHECKPOINT,logs/HoloMotionBoosterK1LaFANWalkWarmup/20261010_171747-motion_tracking_booster_k1_lafan_walk_warmup/model_26998.pt}

algo:
  config:
    checkpoint_load_mode: finetune
    finetune_continue_iteration: false
    num_learning_iterations: 10000

    # A smaller actor step protects the stable locomotion prior while the
    # policy adapts to the much smaller dance-only dataset.
    actor_learning_rate: 1.0e-5
    critic_learning_rate: 3.0e-5
